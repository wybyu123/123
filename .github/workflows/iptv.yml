name: Run IPTV Processors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

# 🚀 必须加上这一段，否则私库/公开库 push 会因权限不足而卡死挂起！
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # 显式传入 token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script
        env:
          # 动态工作目录绑定（如需指定绝对或相对路径，可在此调整）
          LIVE_WORKSPACE: ${{ github.workspace }}
        run: |
          # 运行你刚才编写的处理脚本（请根据脚本实际存放路径调整文件名，例如 md/processor.py）
          python processor.py

      - name: Commit and Push Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-update IPTV merged results [skip ci]" || exit 0
          git push
