name: Import Web FOFA Data

on:
  workflow_dispatch: # 支持后台手动点击运行
  schedule:
    - cron: '0 8 * * *' # 每天自动运行一次（可按需调整）

jobs:
  run-import-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 允许脚本提交代码回仓库

    steps:
      - name: 签出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 如果脚本不需要第三方库（requests 等），这里甚至可以不写 pip install
      - name: 运行网页数据本地合并脚本
        run: |
          python import_fofa_web.py

      - name: 自动提交并推送更新后的 CSV 文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 推送前先拉取，避免冲突
          git pull --rebase origin main || echo "No remote changes or rebase skipped"
          
          # 添加你的 CSV 文件（如果你希望顺便把处理完的 raw 文件也提交或忽略，可以只 add CSV）
          git add 202608100451.csv
          git status
          
          # 检查是否有改动，有则提交并推送
          git diff --staged --quiet || git commit -m "Auto-merge web FOFA IP list to CSV [skip ci]"
          git push
