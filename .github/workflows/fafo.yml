name: Auto Fetch fafo Files


on:
  workflow_dispatch: # 支持后台手动点击运行
  schedule:
    - cron: '0 8 * * *' # 每天自动运行一次（可自行调整）

jobs:
  run-fofa-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 允许脚本提交代码回仓库

    steps:
      - name: 签出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行 FOFA 抓取并合并脚本
        env:
          # 从 GitHub 仓库 Secrets 中读取机密并映射为环境变量
          FOFA_EMAIL: ${{ secrets.FOFA_EMAIL }}
          FOFA_KEY: ${{ secrets.FOFA_KEY }}
        run: |
          python fofa_to_csv.py

      - name: 自动提交并推送更新后的 CSV 文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 推送前先拉取，避免冲突
          git pull --rebase origin main || echo "No remote changes or rebase skipped"
          
          # 添加你的 CSV 文件
          git add 202608100451.csv
          git status
          
          # 检查是否有改动，有则提交并推送
          git diff --staged --quiet || git commit -m "Auto-update FOFA IP list CSV [skip ci]"
          git push
