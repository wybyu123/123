name: Auto Fetch fafo Files

on:
  workflow_dispatch: # 支持网页后台手动点击运行
  schedule:
    - cron: '0 8 * * *' # 每天北京时间早上 8 点自动运行（可根据需要调整）

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 赋予写权限，允许脚本自动提交代码回仓库

    steps:
      - name: 签出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # ----------------------------------------------------
      # 如果你后续写了自动抓取 FOFA 并合并到 CSV 的 Python 脚本
      # 可以在这里加上执行命令，例如：
      - name: 运行 FOFA 抓取与合并脚本
        env:
          FOFA_EMAIL: ${{ secrets.FOFA_EMAIL }}
          FOFA_KEY: ${{ secrets.FOFA_KEY }}
        run: |
           python fofa_to_csv.py
      # ----------------------------------------------------

      # - name: 运行下载/检测脚本
      #  run: |
      #    python fetch_streams.py

      - name: 自动提交并推送文件到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【核心优化】推送前先拉取远程最新代码并做 rebase，彻底杜绝 push 被拒错误
          git pull --rebase origin main || echo "No remote changes or rebase skipped"
          
          # 添加变动文件（这里以 downloads/ 和你的 CSV 文件夹为例，可根据实际修改）
          git add downloads/
          git status
          
          # 检查是否有文件变动，有则自动提交并加上 [skip cn] 防止无限循环触发
          git diff --staged --quiet || git commit -m "Auto-update downloaded files and data [skip ci]"
          
          # 推送到远程分支
          git push
