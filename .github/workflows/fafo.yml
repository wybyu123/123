name: FOFA Web Spider & Update CSV

on:
  workflow_dispatch: # 支持网页后台手动点击运行
  schedule:
    - cron: '0 8 * * *' # 每天北京时间早上 8 点自动运行（可自行调整）

jobs:
  run-spider:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 赋予写权限，允许脚本自动提交代码回仓库

    steps:
      - name: 签出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖和 Playwright 浏览器
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # 在 GitHub Actions 的 Ubuntu 环境中自动安装 Chromium 浏览器及依赖
          playwright install chromium
          playwright install-deps chromium

      - name: 运行网页抓取与合并脚本
        env:
          FOFA_COOKIE: ${{ secrets.FOFA_COOKIE }}   # <--- 必须有这一句，把密匙映射成环境变量
        run: |
          python fofa_web_spider.py
      - name: 自动提交并推送更新后的 CSV 文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 推送前先拉取，避免冲突
          git pull --rebase origin main || echo "No remote changes or rebase skipped"
          
          # 添加你的 CSV 文件
          git add 202608100451.csv
          git status
          
          # 检查是否有改动，有则提交并推送
          git diff --staged --quiet || git commit -m "Auto-update FOFA web spider results [skip ci]"
          git push
