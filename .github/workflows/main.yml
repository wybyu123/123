name: Auto Fetch Stream Files

on:
  workflow_dispatch: # 支持手动后台点击运行
  schedule:
    - cron: '10 8 * * *' # 每天北京时间早上 8 点自动运行（可自行修改）

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 赋予写权限，允许脚本自动提交代码回仓库

    steps:
      - name: 签出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 运行下载脚本
        run: |
          python fetch_streams.py

      - name: 自动提交并推送文件到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git stash
          git pull --rebase origin main || echo "Rebase skipped"
          git stash pop || echo "No stash to pop"

          # 只添加实际存在的目录和文件，避免因为没生成文件而报错
          [ -d downloads ] && git add downloads/
          [ -d special_files ] && git add special_files/
          [ -f lives_output.json ] && git add lives_output.json

          # 检查是否有变动，有则提交并推送
          git diff --staged --quiet || git commit -m "Auto-update stream files and json [skip ci]"
          git push
